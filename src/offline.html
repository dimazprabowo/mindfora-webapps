<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="color-scheme" content="light dark" />
        <title>Mindfora - Tidak ada koneksi</title>
        <link rel="stylesheet" href="./css/app.css" />
    </head>
    <body class="bg-gradient-to-b from-primary-50 via-white to-white text-gray-900 dark:from-gray-900 dark:via-gray-900 dark:to-gray-950 dark:text-white">
        <main class="flex min-h-full flex-col items-center justify-center px-8 py-12 text-center">
            <div class="relative mb-10 flex h-40 w-40 items-center justify-center" aria-hidden="true">
                <span class="ripple absolute inset-0 rounded-full bg-primary-400/30 dark:bg-primary-500/20"></span>
                <span class="ripple absolute inset-0 rounded-full bg-primary-400/30 dark:bg-primary-500/20" style="animation-delay: 2s"></span>
                <span class="absolute inset-4 rounded-full bg-primary-100 dark:bg-primary-900/40"></span>
                <img src="./logo.svg" alt="" class="breathe relative h-20 w-20 rounded-2xl shadow-lg shadow-primary-600/30" />
            </div>

            <h1 class="text-2xl font-bold">Koneksi terputus</h1>
            <p class="mt-3 max-w-xs text-sm leading-relaxed text-gray-500 dark:text-gray-400">
                Tarik napas sejenak. Mindfora akan tersambung lagi otomatis begitu internet kembali.
            </p>

            <button
                id="retry"
                type="button"
                class="mt-8 inline-flex w-full max-w-xs items-center justify-center gap-2 rounded-xl bg-primary-600 px-6 py-3.5 text-sm font-semibold text-white shadow-lg shadow-primary-600/25 transition active:scale-[0.98] disabled:opacity-70 dark:bg-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 dark:focus:ring-offset-gray-900"
            >
                <svg id="retry-spinner" class="hidden h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"></circle>
                    <path fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" class="opacity-75"></path>
                </svg>
                <span id="retry-label">Coba lagi</span>
            </button>

            <p id="status" class="mt-4 text-xs text-gray-400 dark:text-gray-500" role="status" aria-live="polite">
                Mencoba menghubungkan otomatis...
            </p>
        </main>

        <script type="module" src="./js/offline.js"></script>
    </body>
</html>
